# Actions are pinned to full commit SHAs (version in the trailing comment); Dependabot (github-actions ecosystem) proposes updates.
# Upstream -> downstream flow (ADR-0001, ADR-0028 by analogy). HCW-CloudAssessor_App's publish-core.yml attaches the
# cloud-assessor-core wheel to the GitHub Release of every v* tag (PyPI there is optional and not needed here). This
# repository pins the release asset by URL in pyproject.toml, on one line, as
#   "cloud-assessor-core @ https://github.com/saulpatinojr/HCW-CloudAssessor_App/releases/download/v<version>/cloud_assessor_core-<version>-py3-none-any.whl",  # CORE_REF v<version>
# `uv lock` records the wheel's sha256 and the image build's `uv export --frozen` carries it, so the image's
# `pip install --require-hashes` keeps verifying every third-party file (a git+https pin cannot be hash-checked and would
# break that build).
# First adoption: while the engine is still the local seed (packages/cloud-assessor-core, a workspace member), the
# dependency line carries `CORE_REF v<seed version>-seed`. The run then compares that marker with the latest release
# like any other pin, and the bump step does the switch itself: scripts/adopt_core_wheel.py rewrites the line to the
# URL form above and removes the `[tool.uv]` workspace and sources entries and the Dockerfile's two COPY lines for the
# seed, `git rm -r` deletes the seed (staged, so the pull request carries the deletion), and `uv lock` downloads the
# wheel and records its sha256. That is how the wheel's hash enters uv.lock without anyone typing it. Every later run
# moves the URL line (scripts/adopt_core_wheel.py --bump, an exact replacement, no sed) and re-locks. Each bump also
# regenerates docs/rules/catalog.md from the new catalog, so ci.yml's drift check passes when the catalog changed.
# Both tags are refused unless they are v<major>.<minor>.<patch> (the pin may also be v<version>-seed). With no CORE_REF
# line at all the run exits cleanly.
#
# Two jobs, so the upstream code never shares a runner with the App's key. `bump` runs this repository's scripts and
# the new engine's code (the bump, the compatibility check, the catalog page) with no secret and a read-only
# GITHUB_TOKEN, and hands its result over as an artifact: the changed bump files, the list of deleted paths and the
# outcome. `pull-request` starts on a fresh runner from a clean checkout, runs no project code, accepts only the five
# bump paths and deletions under packages/cloud-assessor-core/, applies them, and only then mints the App token.
# A step in the same job could reach later steps (through $GITHUB_ENV, or by rewriting a downloaded action), which is
# why the split matters. The outcome is untrusted: it picks the label and the title, and auto-merge also needs the
# repository variable CORE_AUTOMERGE; the merge itself still waits for the required checks on the pull request.
# The App token has no `workflows` permission, so a bump pull request can never change a file under .github/workflows;
# ci.yml and security.yml are written to pass both with the seed and with the wheel.
#
# The pull request is opened with a short-lived GitHub App token (actions/create-github-app-token), not with
# GITHUB_TOKEN. A pull request opened with GITHUB_TOKEN starts no workflow, so the required checks of the
# "Protect main" ruleset never ran on it and it could never merge. One opened with the App token does start
# them, so this edition's own CI (ci, security) also runs on the bump pull request; the compatibility check
# in the `bump` job still runs first and decides the compatible / needs-adaptation label and whether
# auto-merge is asked for.
# The credential is the HCW Main Admin App (a GitHub App owned by the repository owner, installed on this
# repository). Its client ID is the repository variable HCW_MAIN_ADMIN_CLIENT_ID (not a secret) and its private
# key is the repository secret HCW_MAIN_ADMIN_PRIVATE_KEY. The key lives only as that secret and is never printed.
# To rotate it: generate a new key on the App's settings page (https://github.com/settings/apps), replace the
# secret in every repository that holds the key (the App is installed on the four add-on
# repositories), then delete the old key there. Only the token step of the `pull-request` job is given the key. It mints
# a token for this repository only with Contents and Pull requests write, and the action revokes the token when the job
# ends.
# GITHUB_TOKEN is read-only here.
# A manual run with probe=true mints the token and makes two read-only API calls (the repository, and the list of
# repositories the token covers, which must be this one only) and nothing else that writes,
# to prove the credential on a day when there is no release to adopt:
#   gh workflow run core-update.yml --ref main -f probe=true
name: core-update
on:
  schedule: [{ cron: "41 */6 * * *" }]
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream release tag to adopt (default: latest release)"
        required: false
      probe:
        description: "Only prove the GitHub App credential: mint the token and make read-only calls (default: false)"
        type: boolean
        default: false
permissions: {}
env:
  UPSTREAM: saulpatinojr/HCW-CloudAssessor_App
jobs:
  # Job 1 of 2. Runs this repository's scripts and the new engine's code (tests, check-catalog --doc), so it gets no
  # secret at all: GITHUB_TOKEN is read-only and reaches only the refs step, which runs no project code. What it
  # produces leaves as an artifact: the bump's files, the list of deleted paths and the compatibility outcome.
  bump:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.refs.outputs.changed }}
      latest: ${{ steps.refs.outputs.latest }}
      current: ${{ steps.refs.outputs.current }}
    steps:
      # persist-credentials: false: no token is left in the git config for the project code below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - id: refs
        name: Compare the pinned CORE_REF with the latest upstream release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", REQUESTED: "${{ inputs.ref }}" }
        run: |
          set -euo pipefail
          current="$(grep -oE "#[[:space:]]*CORE_REF[[:space:]]+v[0-9][0-9A-Za-z.+-]*" pyproject.toml | head -1 | awk '{print $NF}' || true)"
          if [ -z "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no CORE_REF in pyproject.toml: the engine seed is still local (packages/cloud-assessor-core); nothing to adopt yet"
            exit 0
          fi
          latest="${REQUESTED:-$(gh api "repos/${UPSTREAM}/releases/latest" --jq .tag_name 2>/dev/null || true)}"
          if [ -z "$latest" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "::notice::upstream has no release yet"; exit 0; fi
          # Both values reach later shell steps, GITHUB_OUTPUT and a URL. Only a plain release tag (and, for the pin, the
          # seed marker) is accepted, so a hostile tag or `inputs.ref` cannot add an output line or inject an edit or a
          # command. Checked before anything is written to GITHUB_OUTPUT.
          if ! [[ "$latest" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::refusing the upstream tag: it is not v<major>.<minor>.<patch>"; exit 1
          fi
          if ! [[ "$current" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-seed)?$ ]]; then
            echo "::error::refusing the CORE_REF in pyproject.toml: it is not v<major>.<minor>.<patch> or v<version>-seed"; exit 1
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"; echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "already at $current"; else echo "changed=true" >> "$GITHUB_OUTPUT"; echo "$current -> $latest"; fi
      - if: steps.refs.outputs.changed == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "3.14" }
      - if: steps.refs.outputs.changed == 'true'
        run: python -m pip install "uv==0.11.32"
      - if: steps.refs.outputs.changed == 'true'
        name: Bump CORE_REF and re-lock
        env: { LATEST: "${{ steps.refs.outputs.latest }}", CURRENT: "${{ steps.refs.outputs.current }}" }
        run: |
          set -euo pipefail
          case "$CURRENT" in
            *-seed)
              # First adoption: from the local seed to the release wheel (see the header).
              python scripts/adopt_core_wheel.py --tag "$LATEST"
              git rm -r -q packages/cloud-assessor-core
              uv lock
              ;;
            *)
              # One line carries the release tag, the wheel file name and the CORE_REF marker; all move together. An exact
              # string replacement (no sed script), built from the two validated tags.
              python scripts/adopt_core_wheel.py --bump --from "$CURRENT" --tag "$LATEST"
              uv lock --upgrade-package cloud-assessor-core
              ;;
          esac
          grep -q "CORE_REF ${LATEST}" pyproject.toml
          # The rules page is generated from the catalog the engine ships; CI fails when it drifts. A catalog the script
          # cannot read is left for the compatibility check to report (the pull request is then "needs adaptation").
          uv sync --frozen --all-packages
          if uv run python scripts/check-catalog.py --doc > "${RUNNER_TEMP}/catalog.md"; then
            mv "${RUNNER_TEMP}/catalog.md" docs/rules/catalog.md
          else
            echo "::warning::docs/rules/catalog.md could not be regenerated from ${LATEST}'s catalog"
          fi
          git --no-pager diff --stat HEAD
      - if: steps.refs.outputs.changed == 'true'
        id: compat
        name: Compatibility check (lint, tests, catalog, browser e2e)
        continue-on-error: true
        run: |
          set -euo pipefail
          uv sync --frozen --all-packages
          uv run ruff check . && uv run python scripts/check-catalog.py && uv run pytest -q
          npm init -y >/dev/null && npm install --no-save --no-audit --no-fund "@playwright/test@1.63.0" && npx playwright install --with-deps chromium
          CI=1 npx playwright test -c tests/e2e/playwright.config.ts
      # Only the five bump paths travel, and only when they changed; every deletion is listed (job 2 refuses any outside
      # the seed). The outcome is the compatibility step's result, written as one word.
      - if: steps.refs.outputs.changed == 'true'
        name: Collect the bump for the pull-request job
        env: { COMPAT: "${{ steps.compat.outcome }}" }
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/bump"
          rm -rf "$dir"; mkdir -p "$dir/files"
          for path in pyproject.toml uv.lock infrastructure/docker/Dockerfile .dockerignore docs/rules/catalog.md; do
            if ! git diff --quiet HEAD -- "$path"; then
              mkdir -p "$dir/files/$(dirname "$path")"; cp -- "$path" "$dir/files/$path"
            fi
          done
          git diff --name-only --diff-filter=D HEAD > "$dir/deleted.txt"
          printf '%s\n' "$COMPAT" > "$dir/outcome.txt"
          find "$dir" -type f | sed "s|^${dir}/||"
      - if: steps.refs.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-bump
          path: ${{ runner.temp }}/bump
          include-hidden-files: true # .dockerignore
          if-no-files-found: error
          retention-days: 1

  # Job 2 of 2. A fresh runner with a clean checkout of the same commit. It runs no project code: it checks the
  # artifact, applies it, and only then mints the App token and opens the pull request. Everything in the artifact
  # came from job 1, which ran upstream code, so it is untrusted: only the five paths and deletions under the seed are
  # accepted, and the outcome only chooses the label and the title. Auto-merge also needs the repository variable
  # CORE_AUTOMERGE, and the merge itself waits for the required checks on the pull request.
  pull-request:
    needs: bump
    if: needs.bump.outputs.changed == 'true' || inputs.probe
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      # persist-credentials: false — create-pull-request sets its own Authorization header for the push; with the
      # checkout's persisted header beside it, git sends two and GitHub answers 400 (seen in the Migrate App's rules-refresh).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - if: needs.bump.outputs.changed == 'true' && !inputs.probe
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: core-bump
          path: ${{ runner.temp }}/bump
      - if: needs.bump.outputs.changed == 'true' && !inputs.probe
        id: apply
        name: Check the bump artifact and apply it (only the five paths, deletions under the seed only)
        env: { LATEST: "${{ needs.bump.outputs.latest }}", CURRENT: "${{ needs.bump.outputs.current }}" }
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/bump"
          allowed='^(pyproject\.toml|uv\.lock|infrastructure/docker/Dockerfile|\.dockerignore|docs/rules/catalog\.md)$'
          [[ "$LATEST" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::the upstream tag is not v<major>.<minor>.<patch>"; exit 1; }
          [[ "$CURRENT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-seed)?$ ]] || { echo "::error::the pinned CORE_REF is malformed"; exit 1; }
          [ -d "$dir/files" ] && [ -f "$dir/deleted.txt" ] && [ -f "$dir/outcome.txt" ] || { echo "::error::the artifact is incomplete"; exit 1; }
          if [ -n "$(find "$dir" ! -type f ! -type d -print -quit)" ]; then echo "::error::the artifact holds a link or a special file"; exit 1; fi
          bad=0
          while IFS= read -r entry; do
            case "$entry" in files|deleted.txt|outcome.txt) ;; *) echo "::error::unexpected entry in the artifact: ${entry}"; bad=1 ;; esac
          done < <(ls -A "$dir")
          while IFS= read -r rel; do
            [[ "$rel" =~ $allowed ]] || { echo "::error::the artifact carries a file outside the bump's paths: ${rel}"; bad=1; }
          done < <(cd "$dir/files" && find . -type f | sed 's|^\./||')
          while IFS= read -r path; do
            if [[ "$path" =~ ^packages/cloud-assessor-core/[A-Za-z0-9._/-]+$ && "$path" != *..* ]] && git ls-files --error-unmatch -- "$path" >/dev/null 2>&1; then continue; fi
            echo "::error::a deletion outside the seed, or of an untracked path: ${path}"; bad=1
          done < "$dir/deleted.txt"
          outcome="$(head -c 16 "$dir/outcome.txt" | tr -d '\n')"
          case "$outcome" in success|failure) ;; *) echo "::error::the outcome is neither success nor failure"; bad=1 ;; esac
          [ "$bad" = 0 ] || exit 1
          while IFS= read -r rel; do cp -- "$dir/files/$rel" "$rel"; done < <(cd "$dir/files" && find . -type f | sed 's|^\./||')
          while IFS= read -r path; do git rm -q -- "$path"; done < "$dir/deleted.txt"
          # What create-pull-request will commit: the five paths, and deletions under the seed. Nothing else.
          while IFS= read -r path; do
            [[ "$path" =~ $allowed || "$path" == packages/cloud-assessor-core/* ]] || { echo "::error::unexpected change: ${path}"; bad=1; }
          done < <(git diff --cached --name-only; git diff --name-only; git ls-files --others --exclude-standard)
          [ "$bad" = 0 ] || exit 1
          git --no-pager diff --cached --stat HEAD
          git --no-pager diff --stat
          # Untrusted (job 1 ran upstream code): used for the label and the title only.
          echo "outcome=${outcome}" >> "$GITHUB_OUTPUT"
      - id: app-token
        name: GitHub App token (this repository only; Contents and Pull requests write)
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.HCW_MAIN_ADMIN_CLIENT_ID }}
          private-key: ${{ secrets.HCW_MAIN_ADMIN_PRIVATE_KEY }}
          repositories: ${{ github.repository }}
          permission-contents: write
          permission-pull-requests: write
      - if: inputs.probe
        name: Probe - read-only calls as the GitHub App (manual run with probe=true)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Minted an installation token for the GitHub App ${APP_SLUG}."
          gh api "repos/${REPO}" --jq '"Read-only call as the App succeeded for " + .full_name'
          covered="$(gh api installation/repositories --jq '[.repositories[].full_name] | join(",")')"
          echo "The token covers these repositories: ${covered}"
          test "${covered}" = "${REPO}" || { echo "::error::The token must cover ${REPO} and nothing else"; exit 1; }
      - if: needs.bump.outputs.changed == 'true' && !inputs.probe
        id: pr
        name: Open the bump pull request (ready for review)
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: core-update/${{ needs.bump.outputs.latest }}
          title: "core: adopt upstream ${{ needs.bump.outputs.latest }} (${{ steps.apply.outputs.outcome == 'success' && 'compatible' || 'needs adaptation' }})"
          commit-message: "core: bump cloud-assessor-core ${{ needs.bump.outputs.current }} -> ${{ needs.bump.outputs.latest }}"
          labels: core-update,${{ steps.apply.outputs.outcome == 'success' && 'compatible' || 'needs-adaptation' }}
          # Paths that exist before and after the first adoption (a path that matches nothing makes `git add` add
          # nothing at all). The seed's deletion is already staged by `git rm` in the apply step and is committed with these.
          add-paths: |
            pyproject.toml
            uv.lock
            infrastructure/docker/Dockerfile
            .dockerignore
            docs/rules/catalog.md
          body: |
            Upstream `saulpatinojr/HCW-CloudAssessor_App` released **${{ needs.bump.outputs.latest }}** (this edition pinned `${{ needs.bump.outputs.current }}`).

            Compatibility check in this workflow run (lint, unit, contract, security, catalog, Playwright e2e): **${{ steps.apply.outputs.outcome }}**.
            When the old pin ends in `-seed`, this is the first adoption: it also deletes the seed under `packages/cloud-assessor-core` and the two Dockerfile lines that placed it (`scripts/adopt_core_wheel.py`), and `uv.lock` now carries the wheel's sha256. `docs/rules/catalog.md` is regenerated from the new catalog on every bump.
            The compatibility check ran in the run's `bump` job, which holds no secret; this pull request was opened by its `pull-request` job after checking that only the bump's paths changed.
            Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            - compatible: merge (automatic if the repository variable `CORE_AUTOMERGE` is `true`).
            - needs adaptation: fix this edition on this branch, then merge.

            ADR-0001 (engine seeded here, handed upstream), ADR-0028 (downstream flow, by analogy).
      - if: needs.bump.outputs.changed == 'true' && steps.apply.outputs.outcome == 'success' && vars.CORE_AUTOMERGE == 'true' && steps.pr.outputs.pull-request-number != '' && !inputs.probe
        name: Auto-merge the compatible bump
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        # The pull request is open and its checks run whatever happens here, so a refusal (for example the
        # repository setting "Allow auto-merge" being off) is a warning to merge by hand, not a failed run.
        run: |
          if ! gh pr merge --squash --auto "$PR_NUMBER"; then
            echo "::warning::Auto-merge was not turned on for pull request #${PR_NUMBER}; merge it by hand."
            echo "Auto-merge needs the repository setting Allow auto-merge to be on."
          fi
      - if: needs.bump.outputs.changed == 'true' && !inputs.probe && steps.apply.outputs.outcome != 'success'
        env: { LATEST: "${{ needs.bump.outputs.latest }}" }
        run: echo "::warning::Upstream ${LATEST} is not compatible with this edition; see the pull request."
