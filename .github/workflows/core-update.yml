# Actions are pinned to full commit SHAs (version in the trailing comment); Dependabot (github-actions ecosystem) proposes updates.
# Upstream -> downstream flow (ADR-0001, ADR-0028 by analogy). HCW-CloudAssessor_App's publish-core.yml attaches the
# cloud-assessor-core wheel to the GitHub Release of every v* tag (PyPI there is optional and not needed here). This
# repository pins the release asset by URL in pyproject.toml, on one line, as
#   "cloud-assessor-core @ https://github.com/saulpatinojr/HCW-CloudAssessor_App/releases/download/v<version>/cloud_assessor_core-<version>-py3-none-any.whl",  # CORE_REF v<version>
# `uv lock` records the wheel's sha256 and the image build's `uv export --frozen` carries it, so the image's
# `pip install --require-hashes` keeps verifying every third-party file (a git+https pin cannot be hash-checked and would
# break that build).
# First adoption: while the engine is still the local seed (packages/cloud-assessor-core, a workspace member), the
# dependency line carries `CORE_REF v<seed version>-seed`. The run then compares that marker with the latest release
# like any other pin, and the bump step does the switch itself: scripts/adopt_core_wheel.py rewrites the line to the
# URL form above and removes the `[tool.uv]` workspace and sources entries and the Dockerfile's two COPY lines for the
# seed, `git rm -r` deletes the seed (staged, so the pull request carries the deletion), and `uv lock` downloads the
# wheel and records its sha256. That is how the wheel's hash enters uv.lock without anyone typing it. Every later run
# moves the URL line with sed and re-locks. Each bump also regenerates docs/rules/catalog.md from the new catalog, so
# ci.yml's drift check passes when the catalog changed. With no CORE_REF line at all the run exits cleanly.
# The App token has no `workflows` permission, so a bump pull request can never change a file under .github/workflows;
# ci.yml and security.yml are written to pass both with the seed and with the wheel.
#
# The pull request is opened with a short-lived GitHub App token (actions/create-github-app-token), not with
# GITHUB_TOKEN. A pull request opened with GITHUB_TOKEN starts no workflow, so the required checks of the
# "Protect main" ruleset never ran on it and it could never merge. One opened with the App token does start
# them, so this edition's own CI (ci, security) also runs on the bump pull request; the compatibility check
# below still runs first, in this run, and decides the compatible / needs-adaptation label and whether
# auto-merge is asked for.
# The credential is the HCW Main Admin App (a GitHub App owned by the repository owner, installed on this
# repository). Its client ID is the repository variable HCW_MAIN_ADMIN_CLIENT_ID (not a secret) and its private
# key is the repository secret HCW_MAIN_ADMIN_PRIVATE_KEY. The key lives only as that secret and is never printed.
# To rotate it: generate a new key on the App's settings page (https://github.com/settings/apps), replace the
# secret in every repository that holds the key (the App is installed on the four add-on
# repositories), then delete the old key there. Only the token step is given the key. That step comes late (after uv and
# the tests have run), mints a token for this repository only with Contents and Pull requests write, and the
# action revokes the token when the job ends.
# GITHUB_TOKEN is read-only here.
# A manual run with probe=true mints the token and makes two read-only API calls (the repository, and the list of
# repositories the token covers, which must be this one only) and nothing else that writes,
# to prove the credential on a day when there is no release to adopt:
#   gh workflow run core-update.yml --ref main -f probe=true
name: core-update
on:
  schedule: [{ cron: "41 */6 * * *" }]
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream release tag to adopt (default: latest release)"
        required: false
      probe:
        description: "Only prove the GitHub App credential: mint the token and make read-only calls (default: false)"
        type: boolean
        default: false
permissions: {}
env:
  UPSTREAM: saulpatinojr/HCW-CloudAssessor_App
jobs:
  check-and-bump:
    runs-on: ubuntu-26.04
    # GITHUB_TOKEN may only read here (checkout, and the public releases API of the upstream repository).
    # Everything that writes uses the App token.
    permissions:
      contents: read
    steps:
      # persist-credentials: false — create-pull-request sets its own Authorization header for the push; with the
      # checkout's persisted header beside it, git sends two and GitHub answers 400 (seen in the Migrate App's rules-refresh).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - id: refs
        name: Compare the pinned CORE_REF with the latest upstream release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", REQUESTED: "${{ inputs.ref }}" }
        run: |
          set -euo pipefail
          current="$(grep -oE "#[[:space:]]*CORE_REF[[:space:]]+v[0-9][0-9A-Za-z.+-]*" pyproject.toml | head -1 | awk '{print $NF}' || true)"
          if [ -z "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no CORE_REF in pyproject.toml: the engine seed is still local (packages/cloud-assessor-core); nothing to adopt yet"
            exit 0
          fi
          latest="${REQUESTED:-$(gh api "repos/${UPSTREAM}/releases/latest" --jq .tag_name 2>/dev/null || true)}"
          if [ -z "$latest" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "::notice::upstream has no release yet"; exit 0; fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"; echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "already at $current"; else echo "changed=true" >> "$GITHUB_OUTPUT"; echo "$current -> $latest"; fi
      - if: steps.refs.outputs.changed == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "3.14" }
      - if: steps.refs.outputs.changed == 'true'
        run: python -m pip install "uv==0.11.32"
      - if: steps.refs.outputs.changed == 'true'
        name: Bump CORE_REF and re-lock
        env: { LATEST: "${{ steps.refs.outputs.latest }}", CURRENT: "${{ steps.refs.outputs.current }}" }
        run: |
          set -euo pipefail
          case "$CURRENT" in
            *-seed)
              # First adoption: from the local seed to the release wheel (see the header).
              python scripts/adopt_core_wheel.py --tag "$LATEST"
              git rm -r -q packages/cloud-assessor-core
              uv lock
              ;;
            *)
              # One line carries the release tag, the wheel file name (version without the v) and the CORE_REF marker; all move together.
              cur_ver="${CURRENT#v}"; new_ver="${LATEST#v}"
              sed -i -E "s|releases/download/${CURRENT}/cloud_assessor_core-${cur_ver}-py3-none-any\.whl(\",?[[:space:]]*#[[:space:]]*CORE_REF[[:space:]]+)${CURRENT}|releases/download/${LATEST}/cloud_assessor_core-${new_ver}-py3-none-any.whl\1${LATEST}|" pyproject.toml
              uv lock --upgrade-package cloud-assessor-core
              ;;
          esac
          grep -q "CORE_REF ${LATEST}" pyproject.toml
          # The rules page is generated from the catalog the engine ships; CI fails when it drifts. A catalog the script
          # cannot read is left for the compatibility check to report (the pull request is then "needs adaptation").
          uv sync --frozen --all-packages
          if uv run python scripts/check-catalog.py --doc > "${RUNNER_TEMP}/catalog.md"; then
            mv "${RUNNER_TEMP}/catalog.md" docs/rules/catalog.md
          else
            echo "::warning::docs/rules/catalog.md could not be regenerated from ${LATEST}'s catalog"
          fi
          git --no-pager diff --stat HEAD
      - if: steps.refs.outputs.changed == 'true'
        id: compat
        name: Compatibility check (lint, tests, catalog, browser e2e)
        continue-on-error: true
        run: |
          set -euo pipefail
          uv sync --frozen --all-packages
          uv run ruff check . && uv run python scripts/check-catalog.py && uv run pytest -q
          npm init -y >/dev/null && npm install --no-save --no-audit --no-fund "@playwright/test@1.63.0" && npx playwright install --with-deps chromium
          CI=1 npx playwright test -c tests/e2e/playwright.config.ts
      - if: steps.refs.outputs.changed == 'true' || inputs.probe
        id: app-token
        name: GitHub App token (this repository only; Contents and Pull requests write)
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.HCW_MAIN_ADMIN_CLIENT_ID }}
          private-key: ${{ secrets.HCW_MAIN_ADMIN_PRIVATE_KEY }}
          repositories: ${{ github.repository }}
          permission-contents: write
          permission-pull-requests: write
      - if: inputs.probe
        name: Probe - read-only calls as the GitHub App (manual run with probe=true)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Minted an installation token for the GitHub App ${APP_SLUG}."
          gh api "repos/${REPO}" --jq '"Read-only call as the App succeeded for " + .full_name'
          covered="$(gh api installation/repositories --jq '[.repositories[].full_name] | join(",")')"
          echo "The token covers these repositories: ${covered}"
          test "${covered}" = "${REPO}" || { echo "::error::The token must cover ${REPO} and nothing else"; exit 1; }
      - if: steps.refs.outputs.changed == 'true' && !inputs.probe
        id: pr
        name: Open the bump pull request (ready for review)
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: core-update/${{ steps.refs.outputs.latest }}
          title: "core: adopt upstream ${{ steps.refs.outputs.latest }} (${{ steps.compat.outcome == 'success' && 'compatible' || 'needs adaptation' }})"
          commit-message: "core: bump cloud-assessor-core ${{ steps.refs.outputs.current }} -> ${{ steps.refs.outputs.latest }}"
          labels: core-update,${{ steps.compat.outcome == 'success' && 'compatible' || 'needs-adaptation' }}
          # Paths that exist before and after the first adoption (a path that matches nothing makes `git add` add
          # nothing at all). The seed's deletion is already staged by `git rm` and is committed with these.
          add-paths: |
            pyproject.toml
            uv.lock
            infrastructure/docker/Dockerfile
            .dockerignore
            docs/rules/catalog.md
          body: |
            Upstream `saulpatinojr/HCW-CloudAssessor_App` released **${{ steps.refs.outputs.latest }}** (this edition pinned `${{ steps.refs.outputs.current }}`).

            Compatibility check in this workflow run (lint, unit, contract, security, catalog, Playwright e2e): **${{ steps.compat.outcome }}**.
            When the old pin ends in `-seed`, this is the first adoption: it also deletes the seed under `packages/cloud-assessor-core` and the two Dockerfile lines that placed it (`scripts/adopt_core_wheel.py`), and `uv.lock` now carries the wheel's sha256. `docs/rules/catalog.md` is regenerated from the new catalog on every bump.
            Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            - compatible: merge (automatic if the repository variable `CORE_AUTOMERGE` is `true`).
            - needs adaptation: fix this edition on this branch, then merge.

            ADR-0001 (engine seeded here, handed upstream), ADR-0028 (downstream flow, by analogy).
      - if: steps.refs.outputs.changed == 'true' && steps.compat.outcome == 'success' && vars.CORE_AUTOMERGE == 'true' && steps.pr.outputs.pull-request-number != '' && !inputs.probe
        name: Auto-merge the compatible bump
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        # The pull request is open and its checks run whatever happens here, so a refusal (for example the
        # repository setting "Allow auto-merge" being off) is a warning to merge by hand, not a failed run.
        run: |
          if ! gh pr merge --squash --auto "$PR_NUMBER"; then
            echo "::warning::Auto-merge was not turned on for pull request #${PR_NUMBER}; merge it by hand."
            echo "Auto-merge needs the repository setting Allow auto-merge to be on."
          fi
      - if: steps.refs.outputs.changed == 'true' && steps.compat.outcome != 'success'
        env: { LATEST: "${{ steps.refs.outputs.latest }}" }
        run: echo "::warning::Upstream ${LATEST} is not compatible with this edition; see the pull request."
