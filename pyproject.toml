[project]
name = "cloud-assessment-lab"
version = "0.1.3"
description = "Hybrid Cloud Works Cloud Assessment, lab edition: assess an Azure Resource Graph export against paraphrased FinOps, Well-Architected cost and Zero Trust criteria, in memory, with no cloud connectivity by design."
readme = "README.md"
license = "MIT"
requires-python = ">=3.15.1,<3.16"
dependencies = [
  # The engine: the upstream release wheel, by URL (uv.lock holds its sha256). core-update.yml moves this line
  # to each newer release and re-locks; do not edit it by hand.
  "cloud-assessor-core @ https://github.com/saulpatinojr/HCW-CloudAssessor_App/releases/download/v0.3.2/cloud_assessor_core-0.3.2-py3-none-any.whl",  # CORE_REF v0.3.2
  "fastapi==0.162.2",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.17.4",
  "httpx==0.28.1",
  "pip-audit==2.10.1",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_assessment_lab"]

# The engine is pinned by its release wheel URL once core-update.yml has adopted it (a direct reference), and
# hatchling refuses to build a project with one unless this is set. Harmless while the engine is the seed.
[tool.hatch.metadata]
allow-direct-references = true

# What the engine (the wheel pinned above) depends on, copied from the METADATA file inside the wheel. Why it is here:
# whenever uv re-resolves the lock (`uv lock`, `uv lock --check`, and Dependabot's uv job for every update it tries),
# uv 0.13 and later first send a HEAD (a request for the file's headers only) to the wheel's address. GitHub answers
# with a redirect to a signed download link that answered that HEAD with 401 (not authorised) from a cloud session on
# 2026-11-13, so the lock failed. With this entry uv does not ask the address at all; the wheel's URL and sha256 in
# uv.lock are unchanged. The Cloud Crawler add-on has the same entry for the same reason. The version must be the
# pinned wheel's: core-update.yml moves it with the pin (the CORE_METADATA marker, scripts/adopt_core_wheel.py), and
# tests/security/test_engine_static_metadata.py compares the entry with the installed wheel. Do not add requires-python
# here: Dependabot rewrites every requires-python in the lock to the project's. Runbook: "Keeping uv away from the
# engine's address".
[[tool.uv.dependency-metadata]]
name = "cloud-assessor-core"
version = "0.3.2"  # CORE_METADATA
requires-dist = ["pydantic<3,>=2.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "error::DeprecationWarning:cloud_assessor_core",
  "error::DeprecationWarning:cloud_assessment_lab",
  # starlette 1.7 prefers httpx2 for its TestClient; httpx is the client this edition pins (brief), so the notice is muted
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_empty = true
