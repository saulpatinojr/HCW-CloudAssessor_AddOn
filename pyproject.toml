[project]
name = "cloud-assessment-lab"
version = "0.1.1"
description = "Hybrid Cloud Works Cloud Assessment, lab edition: assess an Azure Resource Graph export against paraphrased FinOps, Well-Architected cost and Zero Trust criteria, in memory, with no cloud connectivity by design."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14.6,<3.15"
dependencies = [
  # The engine. Until the first adoption it is the local seed (packages/cloud-assessor-core, a workspace member) and
  # the marker below names the seed; core-update.yml reads it, and its first run after a newer upstream release
  # replaces this line with the release wheel by URL (scripts/adopt_core_wheel.py), deletes the seed and re-locks.
  "cloud-assessor-core",  # CORE_REF v0.1.0-seed
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.17.3",
  "httpx==0.28.1",
  "pip-audit==2.10.1",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_assessment_lab"]

# The engine is pinned by its release wheel URL once core-update.yml has adopted it (a direct reference), and
# hatchling refuses to build a project with one unless this is set. Harmless while the engine is the seed.
[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
workspace = { members = ["packages/cloud-assessor-core"] }

[tool.uv.sources]
cloud-assessor-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "packages/cloud-assessor-core/tests"]
addopts = "-ra"
filterwarnings = [
  "error::DeprecationWarning:cloud_assessor_core",
  "error::DeprecationWarning:cloud_assessment_lab",
  # starlette 1.7 prefers httpx2 for its TestClient; httpx is the client this edition pins (brief), so the notice is muted
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["packages/cloud-assessor-core/src", "src"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_empty = true
